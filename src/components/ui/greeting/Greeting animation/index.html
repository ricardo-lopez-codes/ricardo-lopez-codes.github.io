<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dennis Snellenberg Style — Multilingual Greeting Preloader</title>
  <style>
    @font-face {
      font-family: 'Neue Montreal';
      src: url('./fonts/NeueMontreal-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Montreal';
      src: url('./fonts/NeueMontreal-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #141517;
      color: #ffffff;
      font-family: 'Neue Montreal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Fixed Preloader Curtain */
    .preloader {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1000;
      background-color: #141517;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: all;
    }

    .preloader.slide-up {
      transform: translateY(-100vh);
      transition: transform 0.85s cubic-bezier(0.76, 0, 0.24, 1) 0.25s;
    }

    .curve-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% + 300px);
      pointer-events: none;
      fill: #141517;
    }

    /* Word Container & Typography */
    .word-container {
      position: relative;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      user-select: none;
      font-size: clamp(1.25rem, 3.75vw, 4rem);
      line-height: 1;
      letter-spacing: -0.03em;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.4), 0 0 32px rgba(255, 255, 255, 0.2);
      transition: opacity 0.16s ease-out, transform 0.16s ease-out;
    }

    .word-container.fade-out {
      opacity: 0;
      transform: scale(0.98);
    }

    .word-container.fade-in {
      opacity: 1;
      transform: scale(1);
    }

    /* Glowing Dot */
    .dot {
      display: inline-block;
      border-radius: 50%;
      background: #ffffff;
      flex-shrink: 0;
      width: clamp(12px, 1.1vw, 16px);
      height: clamp(12px, 1.1vw, 16px);
      margin-right: clamp(14px, 1.4vw, 20px);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.95), 0 0 20px rgba(255, 255, 255, 0.55);
    }

    /* Page Content */
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 1.5rem;
      max-width: 42rem;
    }

    .tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #999d9e;
      margin-bottom: 1.25rem;
      font-weight: 500;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 400;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
    }

    p {
      color: #999d9e;
      font-size: clamp(1rem, 1.3vw, 1.25rem);
      line-height: 1.6;
      margin-bottom: 2.5rem;
      font-weight: 300;
    }

    .btn-replay {
      padding: 1rem 2.25rem;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-replay:hover {
      background: #ffffff;
      color: #141517;
      transform: scale(1.04);
    }
  </style>
</head>
<body>

  <!-- Preloader Screen -->
  <div class="preloader" id="preloader">
    <div class="word-container fade-in" id="wordContainer">
      <span class="dot"></span>
      <span id="greetingText">வணக்கம்</span>
    </div>
    <svg class="curve-svg">
      <path id="curvePath" />
    </svg>
  </div>

  <!-- Landing Content -->
  <main class="content">
    <span class="tag">Dennis Snellenberg Style</span>
    <h1>Greeting Animation</h1>
    <p>
      The multilingual greeting sequence cycles across languages, ending on Hello,
      followed by the signature SVG quadratic curve curtain lifting smoothly.
    </p>
    <button class="btn-replay" onclick="startSequence()">Replay Animation</button>
  </main>

  <script>
    const words = [
      "வணக்கம்",      // 1. Tamil (First)
      "Bonjour",      // 2. French
      "Ciao",         // 3. Italian
      "Olá",          // 4. Portuguese
      "こんにちは",     // 5. Japanese
      "مرحبا",        // 6. Arabic
      "¿Qué onda?",   // 7. Mexican Spanish
      "Привет",       // 8. Russian
      "Halo",         // 9. Indonesian
      "Merhaba",      // 10. Turkish
      "안녕하세요",    // 11. Korean
      "你好",         // 12. Chinese
      "Hallå",        // 13. Swedish
      "Guten tag",    // 14. German
      "Hello",        // 15. English (Final ending greeting)
    ];

    const preloader = document.getElementById("preloader");
    const greetingText = document.getElementById("greetingText");
    const wordContainer = document.getElementById("wordContainer");
    const curvePath = document.getElementById("curvePath");

    let timer = null;

    function getCurvePaths() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const initial = `M0 0 L${w} 0 L${w} ${h} Q${w / 2} ${h + 300} 0 ${h} L0 0`;
      const target = `M0 0 L${w} 0 L${w} ${h} Q${w / 2} ${h} 0 ${h} L0 0`;
      return { initial, target };
    }

    function startSequence() {
      if (timer) clearTimeout(timer);

      // Reset
      preloader.classList.remove("slide-up");
      preloader.style.display = "flex";
      wordContainer.classList.remove("fade-out");
      wordContainer.classList.add("fade-in");

      const paths = getCurvePaths();
      curvePath.setAttribute("d", paths.initial);

      let idx = 0;
      greetingText.textContent = words[idx];

      function step() {
        if (idx < words.length - 1) {
          timer = setTimeout(() => {
            idx++;
            greetingText.textContent = words[idx];
            step();
          }, idx === 0 ? 800 : 155);
        } else {
          // Hold on final "Hello"
          timer = setTimeout(() => {
            animateExit();
          }, 550);
        }
      }

      step();
    }

    function animateExit() {
      const paths = getCurvePaths();
      preloader.classList.add("slide-up");

      // Animate curve path to straight
      let start = null;
      const duration = 750;
      const w = window.innerWidth;
      const h = window.innerHeight;

      function render(time) {
        if (!start) start = time;
        const p = Math.min((time - start) / duration, 1);
        const ease = 0.5 - Math.cos(p * Math.PI) / 2; // in-out
        const curveOffset = (1 - ease) * 300;

        const currentD = `M0 0 L${w} 0 L${w} ${h} Q${w / 2} ${h + curveOffset} 0 ${h} L0 0`;
        curvePath.setAttribute("d", currentD);

        if (p < 1) {
          requestAnimationFrame(render);
        } else {
          setTimeout(() => {
            preloader.style.display = "none";
          }, 300);
        }
      }

      requestAnimationFrame(render);
    }

    window.addEventListener("resize", () => {
      const paths = getCurvePaths();
      curvePath.setAttribute("d", paths.initial);
    });

    // Start on load
    startSequence();
  </script>
</body>
</html>
